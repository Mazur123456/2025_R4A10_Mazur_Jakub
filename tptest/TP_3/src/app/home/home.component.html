<div *ngFor="let voyage of paginatedVoyages" class="voyage-card">
    <h2>{{ voyage.destination }}</h2>
    <p>{{ voyage.description | slice:0:20 }}...</p>
    <p>{{ voyage.prix | currency:'EUR' }}</p>
    <a [routerLink]="['/voyage', voyage.id]">View Details</a>
    <button (click)="deleteVoyage(voyage.id)">Delete</button>
  </div>
  
  <div class="pagination">
    <button (click)="currentPage = currentPage - 1" [disabled]="currentPage === 1">Previous</button>
    <span>Page {{ currentPage }}</span>
    <button (click)="currentPage = currentPage + 1" [disabled]="currentPage * itemsPerPage >= voyages.length">Next</button>
  </div>
